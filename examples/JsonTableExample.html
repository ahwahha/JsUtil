<html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<style>
		#container {
			border: #ddd solid 1px;
			padding: 5px;
		}

		#container table {
			border-collapse: collapse;
		}

		.jsonTable.button {
			font-size: 80%;
		}

		.button {
			margin: 3px;
			border: 1px solid #AAAAAA;
			box-shadow: #444444 1px 1px 2px;
			border-radius: 4px;
			padding: 2px 10px 2px 10px;
			text-decoration: none;
			display: inline-block;
			text-shadow: 0px 0px 0px #000000;
			color: #000000;
			background-color: #FFFFFF;
			background-image: linear-gradient(to bottom, #cccccc, #e8e8e8, #f8f8f8, #ffffff, #f8f8f8, #e8e8e8, #cccccc);
			outline: none;
		}

		.button:hover {
			box-shadow: #555555 2px 2px 3px;
			border: 1px solid #999999;
		}

		.button:active {
			border: 1px solid #666666;
			box-shadow: #aaaaaa 0px 0px 0px;
			background-image: linear-gradient(to bottom, #999999, #d8d8d8, #e8e8e8, #eeeeee, #e8e8e8, #d8d8d8, #999999);
			outline: none;
		}

		.red * {
			color: #F00;
		}
	</style>
	<script src="../dist/util_bundle.js" type="text/javascript"></script>
	<script>
		var data;
		Util.loaded(() => {
			// create an instance of the JsonTable class
			var table = null;
			try {

				table = new JsonTable(Util.get('#container'));

				// demo changing container, here unnecessary
				table.setContainer(document.getElementById("container"));

				// set the data for the table
				Util.loadScript('sampleData.js', new Util(document.head)).then(() => {
					table.setData(Util.clone(data)).refreshTable(true);
				});

				// set the settings for the table
				table.setTableSettings({
					columns: [
						{
							"header": "Select",
							"data": "###row-selected",
							"rowsStyle": { "width": "1%", "padding": "0px 10px" },
							"modifier": function (row) { return table.createSelectBox(row); },
						},
						{
							"header": "Name",
							"data": "name",
							"modifier": function (row) {
								return Util.create('input', { style: 'width:calc(100% - 10px);', disabled: '', value: row.name })
							},
							'class': 'red'
						},
						{
							"header": "Birth At",
							"data": "datetimeOfBirth",
							"rowsStyle": { "width": "1%", "padding": "0px 5px" },
							filterPlaceholder: "yyyy-mm-dd hh:mm:ss",
							"modifier": function (row) {
								return Util.create('input', { type: 'datetime-local', value: row["datetimeOfBirth"] })
									.addEventHandler('change', function (event) {
										table.editData(row['###row-index'], 'datetimeOfBirth', event.target.value);
									})
							}
						},
						{
							"header": "Age",
							"data": "age",
							"rowsStyle": { "width": "1%", "padding": "0px 5px" },
							"modifier": (row) => {
								return Util.create('input', { style: 'width:70px;text-align:center;', value: row.age })
									.addEventHandler('change', function (event) {
										if (new Number(this.value).valueOf()) {
											table.editData(row['###row-index'], 'age', new Number(this.value).valueOf())
										};
									})
							}
						},
						{
							"header": "Title",
							"data": "title",
							"modifier": function (row) {
								return Util.create('input', { type: 'text', style: 'width:calc(100% - 10px);', value: row.title })
									.addEventHandler('change', function (event) {
										table.editData(row['###row-index'], 'title', this.value);
									})
							}
						},
						{
							"header": "Location",
							"rowsStyle": { "width": "150px", "padding": "0px 5px" },
							"data": "location"
						},
						{
							"header": "Remove",
							"data": "###row-removed",
							"rowsStyle": { "width": "1%", "padding": "0px 10px" },
							"modifier": function (row) { return table.createRemoveBox(row); },
						}
					],
					label: "[table label]",
					sortedBy: "age",
					ascending: true,
					start: 1,
					end: 6,
					defaultEnd: 6,
					buttonClass: 'button'
				});

				// fill the table with data
				Util.get('#selected').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getSelected()), 'selected.csv', ','); });
				Util.get('#filtered').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getFiltered()), 'filtered.csv', ','); });
				Util.get('#edited').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getEdited()), 'edited.csv', ','); });
				Util.get('#selectedfiltered').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getSelected(table.getFiltered())), 'selectedFiltered.csv', ','); });
				Util.get('#selectededited').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getSelected(table.getEdited())), 'selectedEdited.csv', ','); });
				Util.get('#filterededited').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getFiltered(table.getEdited())), 'filteredEdited.csv', ','); });
				Util.get('#inserted').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getInserted()), 'inserted.csv', ','); });
				Util.get('#removed').addEventHandler('click', () => { Util.downloadAsCsv(JsonTable.cleanKeys(table.getRemoved()), 'removed.csv', ','); });
				Util.get('#insert').addEventHandler('click', () => { table.insertData({ "name": "", "age": 0, "title": "", "location": "", "datetimeOfBirth": "" }).refreshTable(); });

			} catch (e) { console.log(e); }
		});
	</script>
</head>

<body>
	<div id="container"></div>
	<br>
	<button id='selected' class='button'>get selected</button>
	<button id='filtered' class='button'>get filtered</button>
	<button id='edited' class='button'>get edited</button>
	<br>
	<button id='selectedfiltered' class='button'>get selected filtered</button>
	<button id='selectededited' class='button'>get selected edited</button>
	<button id='filterededited' class='button'>get filtered edited</button>
	<br>
	<button id='inserted' class='button'>get inserted</button>
	<button id='removed' class='button'>get removed</button>
	<br>
	<button id='insert' class='button'>insert new</button>
</body>

</html>
