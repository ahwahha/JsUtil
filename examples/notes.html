<html>

<head>
	<script>
		let data = [];
		
		const columnSetting = [
			{
				"header": "sel.",
				"data": "###row-selected",
				"rowsStyle": { "width": "1%", "padding": "0px 10px" },
				"modifier": function (row) { return myTable.createSelectBox(row); },
				"sortable": true,
				"filterEditable": true
			},
			{
				"header": "Keys",
				"data": "k",
				"rowsStyle": { "width": "25%", "padding": "2px" },
				"modifier": function (row) {
					return createTextarea(row, 'k', row.k)
						.css('width', '100%');
				}
			},
			{
				"header": "Values",
				"data": "v",
				"rowsStyle": { "padding": "2px" },
				"modifier": function (row) {
					return String(row['v']).indexOf('http://') === 0 || String(row['v']).indexOf('https://') === 0
						? Util.create('span', { style: 'width:100%; display: flex; flex-flow: row wrap; align-items: center;' })
							.appendContent(
								createTextarea(row, 'v')
									.css('flex', '1')
									.attr('disabled', row.deprecated_at ? '' : 'unset')
							).appendContent(
								Util.create('span', { class: 'button', style: 'height:18px;' })
									.appendContent('>>')
									.countClicks([
										() => { window.open(row.v.split('\n')[0], '_blank', ''); },
										() => { window.open(row.v.split('\n')[0], '_self', ''); },
										() => { window.open(row.v.split('\n')[0], '', 'width=1000,height=600'); },
										() => { navigator.clipboard.writeText(row.v.split('\n')[0]); }
									], 250)
							)
						: createTextarea(row, 'v')
							.css('width', '100%')
							.attr('disabled', row.deprecated_at ? '' : 'unset');
				}
			},
			{
				"header": "del.",
				"data": "###row-removed",
				"rowsStyle": { "width": "1%", "padding": "0px 10px" },
				"modifier": function (row) { return myTable.createRemoveBox(row); }
			}
		];
	</script>

	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<script src="../dist/util_bundle.js" type="text/javascript"></script>

	<style>
		#container {
			border: #ddd solid 1px;
			padding: 5px;
		}

		#container table {
			border-collapse: collapse;
		}

		.button {
			margin: 3px;
			border: 1px solid #AAAAAA;
			box-shadow: #444444 1px 1px 2px;
			border-radius: 4px;
			padding: 2px 10px 2px 10px;
			text-decoration: none;
			display: inline-block;
			text-shadow: 0px 0px 0px #000000;
			color: #000000;
			background-color: #FFFFFF;
			background-image: linear-gradient(to bottom, #cccccc, #e8e8e8, #f8f8f8, #ffffff, #f8f8f8, #e8e8e8, #cccccc);
			outline: none;
		}

		.button:hover {
			box-shadow: #555555 2px 2px 3px;
			border: 1px solid #999999;
		}

		.button:active {
			border: 1px solid #666666;
			box-shadow: #aaaaaa 0px 0px 0px;
			background-image: linear-gradient(to bottom, #999999, #d8d8d8, #e8e8e8, #eeeeee, #e8e8e8, #d8d8d8, #999999);
			outline: none;
		}
	</style>
	<script>

		Util.loaded(async () => {
			myTable = new JsonTable();
			myTable.setContainer(Util.get('#container'));
			myTable.setTableSettings({
				columns: columnSetting,
				label: Util.create('span')
					.appendContent('Notes: ')
					.appendContent(Util.create('button', { id: 'insert', class: 'button' })
						.appendContent('Insert row')
						.addEventHandler('click', () => { myTable.insertData({ 'k': '', 'v': '' }).refreshTable(true); })
					)
					.appendContent(Util.create('button', { class: 'button' })
						.addEventHandler('click', async function () {
							await navigator.clipboard.writeText(JSON.stringify(JsonTable.cleanKeys(myTable.getRemoved(false, myTable.getFiltered()))));
							alert('data copied to clipboard');
						})
						.appendContent('copy filtered')
					),
				ascending: true,
				start: 1,
				end: 10,
				defaultEnd: 10,
				buttonClass: 'button',
				onrefresh: () => {
					Util.get('textarea').forEach((t) => {
						t.fireEvent('blur');
					})
				},
				filterReturnTrueWhenEmpty: true
			});

			myTable.setData(data).refreshTable(true);
		});


		let createTextarea = function (row, col) {
			let e;
			let output = typeof row[col] === 'object'
				? JSON.stringify(row[col], null, "  ")
				: String(row[col]);
			e = Util.create('textarea', { style: "white-space: pre-wrap;" })
				.appendContentIf((() => {
					if (output.charAt(0) === '"' && output.charAt(output.length - 1) === '"') {
						output = output.substring(1, output.length - 1);
					}
					return output;
				})(), row[col] != null);

			let adjust = () => {
				e
					.css('height', e.entity().value.split('\n').length * 15 + 6 + 'px')
					.css('height', e.entity().scrollHeight + 4 + 'px');
			}

			let edit = () => {
				let v;
				try {
					v = JSON.parse(e.val()
						.replaceAll("\r", "")
						.replaceAll("\n", "")
						.replaceAll("\t", ""))
				} catch (err) {
					v = e.val();
				}
				myTable.editData(row['###row-index'], col, v);
			}

			e
				.addEventHandler(['blur', 'click', 'focus', 'keyup', 'input'], function (event) {
					adjust();
					edit();
				})
				.css('resize', 'none')
				.css('outline', 'none');

			return e;
		};

		function encodeBase64Unicode(str) {
			return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (match, p1) {
				return String.fromCharCode('0x' + p1);
			}));
		}

		function decodeBase64Unicode(str) {
			return decodeURIComponent(atob(str).split('').map(function (c) {
				return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
			}).join(''));
		}

	</script>
</head>

<body>
	<div id="container"></div>
</body>

</html>
